name: 后端静态检查

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: 安装静态检查工具
        run: python -m pip install ruff==0.15.5
      - name: 检查代码格式
        run: ruff format --check backend
      - name: 检查逻辑错误
        run: ruff check --select=F --ignore=F401,F403,F405,F541,F811,F841 --output-format=github backend
